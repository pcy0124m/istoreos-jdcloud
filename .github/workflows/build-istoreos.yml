name: Build iStoreOS for JDCloud RE-SP-01B

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      clean_cache:
        description: '清除缓存重新编译 (true/false)'
        required: false
        default: 'false'
        type: string

  # 定时触发 - 北京时间每天凌晨2:00 (UTC 18:00)
  schedule:
    - cron: '0 18 * * *'

  # 推送触发 (可选，默认注释)
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'config/**'
  #     - 'depends/**'
  #     - '.github/workflows/**'

env:
  # iStoreOS 源码分支
  ISTOREOS_BRANCH: istoreos-24.10
  # 目标设备平台
  TARGET: ramips
  SUBTARGET: mt7621
  # 设备名称
  DEVICE: jdcloud_re-sp-01b
  # 编译配置文件
  CONFIG_FILE: config/jdcloud-re-sp-01b.config
  # 仓库地址
  REPO_URL: https://github.com/istoreos/istoreos.git

jobs:
  build:
    name: Build iStoreOS Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 更新系统并安装编译依赖
          sudo apt-get update -y
          sudo apt-get full-upgrade -y
          # 安装编译依赖 (注意: pkgconf 和 pkg-config 冲突，只装 pkg-config)
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential ccache clang cmake cpio curl device-tree-compiler \
            fastjar flex gawk gcc gcc-multilib g++ g++-multilib gettext git gperf haveged help2man \
            intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool \
            libz-dev lld llvm lrzsz m4 make mkdocs nano ninja-build p7zip patch \
            pkg-config python3 python3-pyelftools python3-setuptools python3-tomli \
            python3-jsonschema re2c rsync rpcsvc-proto ruby scons sed sqlite3 srecord \
            subversion swig texinfo unzip vim wget xmlto xxd zlib1g-dev zstd

          # 创建编译目录
          mkdir -p $GITHUB_WORKSPACE/istoreos

          # 设置 git 配置
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git config --global advice.detachedHead false

          # 设置时区
          sudo timedatectl set-timezone Asia/Shanghai

          echo "编译环境初始化完成"

      - name: Free Disk Space
        run: |
          # 释放磁盘空间，确保有足够的空间编译
          sudo apt-get purge -y dotnet* llvm* firefox* google-chrome* azure-cli*
          sudo apt-get autoremove -y --purge
          sudo rm -rf /usr/share/dotnet /usr/share/llvm /usr/share/swift \
            /opt/ghc /opt/hostedtoolcache /usr/local/lib/android \
            /usr/local/.ghcup /usr/local/.cache /usr/lib/jvm
          df -h /

      - name: Clone iStoreOS Source
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          # 克隆 iStoreOS 官方源码
          echo "正在克隆 iStoreOS 源码 (分支: $ISTOREOS_BRANCH)..."
          git clone --depth 1 -b $ISTOREOS_BRANCH $REPO_URL .
          echo "源码克隆完成"
          echo "当前 HEAD: $(git rev-parse HEAD)"

      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          # 注意: 不缓存 tmp/ — 里面的 .config-package.in 等配置生成物若被
          # 旧缓存污染，会导致 make defconfig 用过期的包菜单，丢掉新配置的包
          path: |
            ${{ github.workspace }}/istoreos/staging_dir
            ${{ github.workspace }}/istoreos/build_dir
            ${{ github.workspace }}/istoreos/dl
            ${{ github.workspace }}/istoreos/.ccache
          key: toolchain-istoreos-${{ env.ISTOREOS_BRANCH }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('config/jdcloud-re-sp-01b.config') }}
          restore-keys: |
            toolchain-istoreos-${{ env.ISTOREOS_BRANCH }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-

      - name: Clear Cache (Optional)
        if: github.event.inputs.clean_cache == 'true'
        run: |
          echo "清除缓存，将重新编译所有内容..."
          rm -rf ${{ github.workspace }}/istoreos/staging_dir
          rm -rf ${{ github.workspace }}/istoreos/build_dir
          rm -rf ${{ github.workspace }}/istoreos/tmp
      - name: Setup Configuration
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          # 复制自定义配置文件
          cp $GITHUB_WORKSPACE/config/jdcloud-re-sp-01b.config .config

          # 更新 feeds
          echo "更新 feeds..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 复制 DIY 脚本到源码目录
          cp $GITHUB_WORKSPACE/depends/diy-part1.sh $GITHUB_WORKSPACE/depends/diy-part2.sh ./
          cp $GITHUB_WORKSPACE/depends/istoreos-default-settings ./

          # 执行 DIY 脚本 - Part 1 (feeds 更新后执行)
          echo "执行 DIY 脚本 Part 1..."
          chmod +x diy-part1.sh
          bash diy-part1.sh

          # 重新安装 feeds (确保自定义的包被加载)
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 执行 DIY 脚本 - Part 2 (配置前执行)
          echo "执行 DIY 脚本 Part 2..."
          chmod +x diy-part2.sh
          bash diy-part2.sh

          # 扩展配置 (确保所有依赖被选中)
          echo "扩展配置..."
          make defconfig

          # ===== 强制写入关键包，再跑 defconfig 解析依赖 =====
          # iStoreOS 24.10 的 defconfig 会丢弃部分 =y 配置项（历史验证:
          # luci-mod-admin-full 通过本方式成功写入固件，config 中的 =y 反而丢失）
          # 方案：defconfig 后用 sed 删除旧配置 + echo 写入 =y，再跑一次 defconfig
          # 第二次 defconfig 会保留 =y 并解析所有依赖，确保包被真正编译打包
          echo "===== 强制写入关键包配置 ====="
          KEY_PKGS="uhttpd uhttpd-mod-lua luci-mod-admin-full luci-mod-system luci-mod-network luci-mod-status luci-app-uhttpd luci-proto-ppp luci-proto-ipv6 luci luci-base luci-theme-argon luci-app-argon-config luci-app-store luci-app-firewall firewall4 luci-app-diskman luci-app-ttyd luci-app-turboacc wpad-mbedtls luci-app-oaf open-app-filter oaf luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-diskman-zh-cn luci-i18n-ttyd-zh-cn luci-i18n-argon-zh-cn luci-i18n-argon-config-zh-cn"
          for pkg in $KEY_PKGS; do
            sed -i "/CONFIG_PACKAGE_${pkg}=/d" .config 2>/dev/null || true
            sed -i "/# CONFIG_PACKAGE_${pkg} is not set/d" .config 2>/dev/null || true
          done
          for pkg in $KEY_PKGS; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done

          echo "最终 make defconfig（解析所有依赖）..."
          make defconfig

          echo "===== 关键包配置验证（应全部为 =y）====="
          VERIFY_FAILED=0
          for pkg in $KEY_PKGS; do
            LINE=$(grep -E "CONFIG_PACKAGE_${pkg}=" .config | head -1)
            if [ -z "$LINE" ]; then
              echo "[丢失] $pkg 未写入 .config！"
              VERIFY_FAILED=$((VERIFY_FAILED+1))
            else
              echo "[OK] $LINE"
            fi
          done
          if [ $VERIFY_FAILED -gt 0 ]; then
            echo "警告: $VERIFY_FAILED 个关键包未能写入 .config，请检查包名是否存在于 feeds"
          fi

          echo "配置完成"
          echo "===== 最终 .config 关键配置 ====="
          grep -E "CONFIG_TARGET_(SYSTEM|SUBTARGET|DEVICE)|CONFIG_TARGET_BOARD|CONFIG_TARGET_PROFILE" .config || true

      - name: Download Sources
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          # 下载源码包
          echo "下载编译所需的源码包..."
          make download -j$(nproc) V=s 2>&1 | tail -20 || true
          echo "源码下载完成"

      - name: Compile Toolchain
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          # 首先编译工具链
          echo "开始编译工具链..."
          make tools/install -j$(nproc) V=s 2>&1 | tail -30 || true
          make toolchain/install -j$(nproc) V=s 2>&1 | tail -30 || true
          echo "工具链编译完成"

      - name: Compile Firmware
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          # 编译固件
          echo "开始编译固件..."
          echo "编译开始时间: $(date '+%Y-%m-%d %H:%M:%S')"

          # 使用 V=s 显示详细输出，失败时可以看到错误
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log | tail -100
          MAKE_EXIT=$?
          if [ $MAKE_EXIT -ne 0 ]; then
            echo "编译失败 (exit code: $MAKE_EXIT)，显示错误日志..."
            grep -i -E "error|failed|cannot|fatal" build.log | tail -50
            exit 1
          fi

          echo "编译完成时间: $(date '+%Y-%m-%d %H:%M:%S')"

          # ===== 固件体积检查 =====
          echo "===== 固件体积检查 ====="
          FIRMWARE_DIR="bin/targets/$TARGET/$SUBTARGET"
          if [ -d "$FIRMWARE_DIR" ]; then
            echo "固件文件列表:"
            ls -lh $FIRMWARE_DIR/*.bin 2>/dev/null || true
            # 检查 sysupgrade 固件体积
            SYSUPGRADE_FILE=$(find $FIRMWARE_DIR -name "*sysupgrade*" -print -quit 2>/dev/null)
            if [ -n "$SYSUPGRADE_FILE" ]; then
              FIRMWARE_SIZE=$(stat -c%s "$SYSUPGRADE_FILE" 2>/dev/null || echo 0)
              FIRMWARE_SIZE_MB=$((FIRMWARE_SIZE / 1024 / 1024))
              echo "sysupgrade 固件体积: ${FIRMWARE_SIZE_MB}MB (${FIRMWARE_SIZE} bytes)"
              if [ "$FIRMWARE_SIZE_MB" -gt 22 ]; then
                echo "警告: 固件体积 ${FIRMWARE_SIZE_MB}MB 超过 22MB 限制!"
                echo "可能需要进一步精简配置文件中的软件包"
              else
                echo "固件体积 ${FIRMWARE_SIZE_MB}MB 在 22MB 限制内"
              fi
            fi
          fi

      - name: Organize Output
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          # 整理编译产物
          echo "整理编译产物..."
          mkdir -p $GITHUB_WORKSPACE/output/firmware
          mkdir -p $GITHUB_WORKSPACE/output/packages

          # 复制固件文件 - 更宽泛的匹配，确保不会漏掉
          echo "搜索固件文件..."
          FIRMWARE_DIR="bin/targets/$TARGET/$SUBTARGET"
          echo "固件目录: $FIRMWARE_DIR"
          if [ -d "$FIRMWARE_DIR" ]; then
            echo "目录内容:"
            ls -la "$FIRMWARE_DIR/" || true
            # 复制所有 .bin 文件
            find "$FIRMWARE_DIR" -name "*.bin" -exec cp -v {} $GITHUB_WORKSPACE/output/firmware/ \; 2>/dev/null || true
            # 复制 manifest
            find "$FIRMWARE_DIR" -name "*.manifest" -exec cp -v {} $GITHUB_WORKSPACE/output/firmware/ \; 2>/dev/null || true
            # 复制 sha256sums
            find "$FIRMWARE_DIR" -name "sha256sums" -exec cp -v {} $GITHUB_WORKSPACE/output/firmware/ \; 2>/dev/null || true
          else
            echo "警告: 固件目录 $FIRMWARE_DIR 不存在！"
            echo "搜索整个 bin/ 目录中的 .bin 文件..."
            find bin/ -name "*.bin" -exec cp -v {} $GITHUB_WORKSPACE/output/firmware/ \; 2>/dev/null || true
          fi

          # 复制 packages (可选)
          # find bin/packages/ -name "*.ipk" -exec cp {} $GITHUB_WORKSPACE/output/packages/ \; 2>/dev/null || true

          # 显示输出文件列表
          echo "===== 固件输出文件 ====="
          ls -la $GITHUB_WORKSPACE/output/firmware/

          # 生成固件信息
          {
            echo "## 固件信息"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|------|"
            echo "| 设备型号 | JDCloud RE-SP-01B |"
            echo "| 目标平台 | ramips/mt7621 |"
            echo "| 源码分支 | $ISTOREOS_BRANCH |"
            echo "| 编译时间 | $(date '+%Y-%m-%d %H:%M:%S') |"
            echo "| 编译机器 | GitHub Actions |"
            echo ""
            echo "### 固件文件列表"
            echo ""
            echo '```'
            ls -la $GITHUB_WORKSPACE/output/firmware/
            echo '```'
          } > $GITHUB_WORKSPACE/output/firmware-info.md

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-jdcloud-re-sp-01b-firmware
          path: |
            ${{ github.workspace }}/output/firmware/
            ${{ github.workspace }}/output/firmware-info.md
          retention-days: 30
          compression-level: 6

      - name: Generate Hash
        working-directory: ${{ github.workspace }}/output/firmware
        run: |
          # 生成固件校验值
          echo "===== 生成固件校验值 ====="
          if ls *.bin 1>/dev/null 2>&1; then
            sha256sum *.bin > sha256sums_custom.txt
            echo "固件 SHA256 校验值:"
            cat sha256sums_custom.txt
          else
            echo "警告: 未找到 .bin 固件文件，跳过校验值生成"
            echo "当前目录文件列表:"
            ls -la
          fi

      - name: Publish Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "固件-latest"
          name: "iStoreOS 京东云 RE-SP-01B 固件 ${{ github.run_number }}"
          body: |
            ## 固件信息

            | 项目 | 值 |
            |------|------|
            | 设备型号 | JDCloud RE-SP-01B |
            | 目标平台 | ramips/mt7621 |
            | 源码分支 | istoreos-24.10 |
            | 编译编号 | ${{ github.run_number }} |
            | 编译时间 | ${{ github.event.head_commit.timestamp }} |

            ### 包含组件
            - Argon 主题（默认）
            - iStore 软件中心
            - LuCI 中文界面
            - 防火墙 / 磁盘管理 / TTYD 终端 / 网络加速
            - OpenAppFilter 应用过滤（DPI 家长控制）

            ### 默认配置
            - LAN IP: 192.168.12.1
            - root 密码: 无（首次登录自行设置）

            ### 刷机说明
            - 通过 Breed 刷入 `istoreos-ramips-mt7621-jdcloud_re-sp-01b-squashfs-sysupgrade.bin`
            - 接 LAN 口，浏览器访问 192.168.12.1
          files: |
            ${{ github.workspace }}/output/firmware/*.bin
            ${{ github.workspace }}/output/firmware/*.manifest
            ${{ github.workspace }}/output/firmware/sha256sums
            ${{ github.workspace }}/output/firmware/sha256sums_custom.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up (Save Space)
        if: always()
        run: |
          # 清理编译中间文件，保留缓存
          echo "清理编译中间文件..."
          if [ -d "${{ github.workspace }}/istoreos/build_dir" ]; then
            find ${{ github.workspace }}/istoreos/build_dir/ -maxdepth 1 -type d -name "target-*" -exec rm -rf {} + 2>/dev/null || true
          fi
          df -h /

      - name: Push Notification (Optional)
        if: always()
        run: |
          echo "编译状态: ${{ job.status }}"
          echo "编译时间: $(date '+%Y-%m-%d %H:%M:%S')"
          if [ "${{ job.status }}" = "success" ]; then
            echo "固件编译成功！请到 Artifacts 区域下载。"
          else
            echo "固件编译失败，请检查日志。"
          fi
